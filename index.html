<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Vault</title>

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <nav class="navbar">
            <div>
                <img src="./assets/logo-navbar.png" alt="Logo">
            </div>

            <ul class="nav-list">
                <li>Features</li>
                <li>How It Works</li>
                <li>Why It's Different</li>
            </ul>

            <button class="btn">
                Get Early Access
            </button>
        </nav>
    </header>

    <main>
        <!-- Banner -->
        <section id="banner">
            <p class="tag">
                <i class="fa-solid fa-bullseye" style="color: rgb(0, 146, 73);"></i>
                <span>Early Access Now Open</span>
            </p>

            <h2 class="banner-heading">
                Structured Thinking, <br>
                <span class="color-heading">
                    Not Just Note-Taking.
                </span>
            </h2>

            <p class="banner-sub">
                A private space to store notes, links, and learning summaries — designed to <br>
                help you think clearly, connect ideas, and turn learning into long-term knowledge.
            </p>

            <div class="banner-btn">
                <button class="btn">
                    Start Building Your Vault
                    <i class="fa-solid fa-arrow-right-long" style="color: rgb(255, 255, 255);"></i>
                </button>

                <button class="btn banner-right-btn">
                    <img src="./assets/play-icon.png" alt="Play Icon">
                    See How It Works
                </button>
            </div>
        </section>
    </main>
</body>

</html>
